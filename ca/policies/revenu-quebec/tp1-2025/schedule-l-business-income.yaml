format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-l-business-income
    source_sha256: e426bc36e2a04bcc99d70c82f3cc72b288a1b915f35c98700aa91a8296542d12
  summary: 'Revenu Quebec Schedule L 2025: add net income on lines 22 through 26.1,

    then add lines 27 through 30 and carry the result to return line 164.

    A partnership member enters RL-15 box 14-7 on line 16.1 and box 1-12

    on line 26.1. Line 40 reports line 8 of form LM-53-V.'
rules:
- name: schedule_l_reported_cryptoassets_gross_income_line_16_1
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: CAD
  source: Revenu Quebec Schedule L 2025, line 16.1; partnership-member instruction.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-l-business-income
          excerpt: 'If you are a member of a partnership:'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-l-business-income
          excerpt: Enter the amount from box 14-7 of your RL-15 slip on line 16.1.
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-l-business-income
          excerpt: Revenu Quebec Schedule L 2025 - Business Income
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: ca/policy/revenu-quebec/tp1-2025/schedule-l-business-income
          excerpt: Revenu Quebec Schedule L 2025 - Business Income
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: 'if schedule_l_is_member_of_partnership: schedule_l_rl15_box_14_7_amount
      else: schedule_l_cryptoassets_gross_income_line_16_1'
