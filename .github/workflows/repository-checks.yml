name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@8d291d286eba337d7defd5498e1c1bb41526c9af # pinned; named corpus release validation
    secrets: inherit
    with:
      # axiom-encode 0.2.2092; immutable pins match .axiom/workflow-toolchain.toml.
      axiom-encode-ref: 3bf5a2afbff0391261ad65bd7497f1b0efaaff85
      axiom-rules-engine-ref: 89571cc2a938707fd60a5489b951135345697296
      axiom-corpus-ref: d24cbde7e6d125a6f859f43c188b0ffbd115b835
      rulespec-us-ref: 044e91ad8afb28d8a3f89c451b908c199a71eb93
      corpus-release-registry-url: ${{ vars.AXIOM_SUPABASE_URL }}
      corpus-release-registry-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      validate-roots: auto
