name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@03d4a673f7304681ecbca3a52e11c26208183739 # pinned; named corpus release validation
    secrets: inherit
    with:
      # Main verifier; retain the existing producer floor.
      encoder-verifier: main
      axiom-encode-ref: b9d376684cfb5e86202daa3451b8fc716703ed19
      axiom-rules-engine-ref: 89571cc2a938707fd60a5489b951135345697296
      axiom-corpus-ref: d24cbde7e6d125a6f859f43c188b0ffbd115b835
      rulespec-us-ref: 044e91ad8afb28d8a3f89c451b908c199a71eb93
      corpus-release-registry-url: ${{ vars.AXIOM_SUPABASE_URL }}
      corpus-release-registry-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      validate-roots: auto
